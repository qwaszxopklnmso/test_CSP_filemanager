{% extends "base.html" %}
{% block title %}管理员登录 · CSP 第二轮文件回收系统{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>管理员登录</h1>
    <p class="muted">用于考生管理、题目资料、提交回收与比赛设置。</p>
    <form method="post" action="{{ url_for('admin_login') }}" autocomplete="off">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <label for="username">管理员账号</label>
      <input id="username" name="username" type="text" placeholder="请输入管理员账号" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" placeholder="请输入密码" required>
      <button type="submit" class="btn btn-primary btn-block">登录后台</button>
    </form>
    <p class="muted small">初始账号 admin / admin12345，首次登录后请立即修改密码。</p>
    <p class="muted small">选手请返回 <a href="{{ url_for('login') }}">选手登录</a>。</p>
  </div>
</div>
{% endblock %}
