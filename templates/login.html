{% extends "base.html" %}
{% block title %}选手登录 · CSP 第二轮文件回收系统{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>选手登录</h1>
    <p class="muted">请输入考号与密码进入文件回收系统。考号示例：{{ exam_id_hint }}</p>
    <form method="post" action="{{ url_for('login') }}" autocomplete="off">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_target or '' }}">
      <label for="exam_id">考号</label>
      <input id="exam_id" name="exam_id" type="text" placeholder="{{ exam_id_hint }}" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" placeholder="请输入密码" required>
      <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>
    <p class="muted small">管理员请从右上角 <a href="{{ url_for('admin_login') }}">管理员入口</a> 登录。</p>
    <p class="muted small">如忘记密码，请联系监考老师重置。</p>
  </div>
</div>
{% endblock %}
